server:
  port: 3306

spring:
  application:
    name: servicio-service
  datasource:
    url: jdbc:mysql://localhost:3306/servicios_db?createDatabaseIfNotExist=true&useSSL=false
    username: root
    password: system
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/